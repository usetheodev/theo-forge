name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # T5.4 / INFRA-004 — release gates: lint + security MUST pass before tagging.
  # These jobs duplicate ci.yml because GitHub Actions does not yet allow
  # cross-workflow `needs:` dependencies; the duplication is justified by the
  # supply-chain integrity benefit (cannot ship a release that failed lint).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt: $out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v1.61.0

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
      - uses: securego/gosec@v2.26.1
        with:
          args: -exclude-dir=testdata ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, security]
    permissions:
      contents: write
      id-token: write   # T5.5 — required for Sigstore keyless signing.
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify tests pass
        run: go test -count=1 -race ./...

      - name: Verify module
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      # T5.5 / INFRA-008 — supply chain attestations on the release artifact.
      # SBOM via CycloneDX gomod; build provenance via the official
      # actions/attest-build-provenance action; signature via Sigstore keyless.
      - name: Generate SBOM (CycloneDX)
        uses: CycloneDX/gh-gomod-generate-sbom@v2
        with:
          version: latest
          args: mod -licenses -json -output sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom.cdx.json
