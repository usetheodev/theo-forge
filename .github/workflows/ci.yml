name: CI

on:
  push:
    branches: [main, develop]

# Single source of truth: the Makefile defines every quality gate.
# CI installs the toolchain, then delegates to `make verify`. Any change
# to gate definitions, thresholds, or tooling lives in the Makefile +
# .golangci.yml + .testcoverage.yml — NOT in this file.
#
# See docs/QUALITY-GATES.md for the gate catalog + rationale.

jobs:
  verify:
    name: Quality Gates (make verify)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install quality-gate toolchain
        run: make install-tools

      - name: make verify (lint + race + coverage + vuln scans)
        run: make verify

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 30
