  <line x1="500" y1="358" x2="350" y2="322" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="295" y="52" width="110" height="36" fill="#1565c0" rx="6" stroke="#333" stroke-width="1"/>
  <text x="350" y="75" text-anchor="middle" font-size="11" fill="white" font-weight="bold">root-builder</text>
