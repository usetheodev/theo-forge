  <rect x="525" y="182" width="110" height="36" fill="#1b5e20" rx="6" stroke="#333" stroke-width="1"/>
  <text x="580" y="205" text-anchor="middle" font-size="11" fill="white" font-weight="bold">pkg-client</text>
  <rect x="145" y="322" width="110" height="36" fill="#4a148c" rx="6" stroke="#333" stroke-width="1"/>
